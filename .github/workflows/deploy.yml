name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # 每日 UTC 2:30（北京时间 10:30）：定时同步 GitHub 仓库列表
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ember-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check Cloudflare binding types
        run: npx wrangler types src/worker-configuration.d.ts --include-runtime=false --check

      - name: Check Astro and TypeScript
        run: npx astro check

      - name: Apply local D1 migrations
        run: npm run db:migrate

      - name: Verify Markdown content import
        run: npm run content:import

      - run: npm run build

      - name: Test Pages and D1 workflows
        run: npm run test:pages

      - name: Validate production D1 binding
        run: |
          if grep -Fq 'database_id = "00000000-0000-0000-0000-000000000000"' wrangler.toml; then
            echo '::error::Replace the placeholder D1 database_id in wrangler.toml before deploying.'
            exit 1
          fi

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply ember-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dac9c6ecf368cfaf47811fb2d1a2fdad

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist-pages --project-name=ember-space --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dac9c6ecf368cfaf47811fb2d1a2fdad
